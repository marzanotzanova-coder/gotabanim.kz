<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoTAB — Админ</title>
<link rel="stylesheet" href="gotab.css">
<style>
.admin-page{min-height:100vh;padding:28px 20px 60px;max-width:1100px;margin:0 auto}

.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 24px}
.stat-label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.stat-value{font-size:36px;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-sub{font-size:12px;color:var(--muted);margin-top:4px}

.admin-section{margin-bottom:40px}
.admin-section-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:10px}

.search-row{margin-bottom:14px}
.search-input{width:100%;max-width:340px;padding:10px 16px;background:#0a1628;border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--primary)}
.search-input::placeholder{color:var(--muted)}

.users-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead{background:var(--surface2)}
th{padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:13px 16px;font-size:13px;color:var(--text);border-bottom:1px solid rgba(30,58,95,.5)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(14,165,233,.03)}

.td-name{font-weight:600}
.td-email{color:var(--muted)}
.td-phone{color:#38bdf8}
.td-date{color:var(--muted);font-size:12px}
.badge-admin{padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700;background:rgba(14,165,233,.15);color:#38bdf8;border:1px solid rgba(14,165,233,.3)}
.table-empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}

.admin-nav-badge{padding:3px 10px;border-radius:100px;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);font-size:11px;font-weight:700;color:#c4b5fd}
</style>
</head>
<body>

<nav class="top-nav">
  <img src="gotab_logo.png" alt="GoTAB">
  <div class="nav-user">
    <span class="admin-nav-badge">Админ</span>
    <span class="nav-user-name" id="userName"></span>
    <button class="btn-logout" onclick="logout()">Шығу</button>
  </div>
</nav>

<div class="admin-page">

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Барлық мұғалімдер</div>
      <div class="stat-value" id="statTotal">—</div>
      <div class="stat-sub">тіркелген пайдаланушы</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Бүгін тіркелген</div>
      <div class="stat-value" id="statToday">—</div>
      <div class="stat-sub" id="statDate">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Осы аптада</div>
      <div class="stat-value" id="statWeek">—</div>
      <div class="stat-sub">соңғы 7 күн</div>
    </div>
  </div>

  <div class="admin-section">
    <div class="admin-section-title">👥 Тіркелген мұғалімдер</div>
    <div class="search-row">
      <input class="search-input" id="searchInput" placeholder="Аты немесе email бойынша іздеу..." oninput="filterUsers()">
    </div>
    <div class="users-table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Аты-жөні</th>
            <th>Email</th>
            <th>Телефон</th>
            <th>Тіркелген күні</th>
            <th>Рөл</th>
          </tr>
        </thead>
        <tbody id="usersBody">
          <tr><td colspan="6" class="table-empty">Жүктелуде...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
let allUsers = [];

const MONTHS = ['қаңтар','ақпан','наурыз','сәуір','мамыр','маусым','шілде','тамыз','қыркүйек','қазан','қараша','желтоқсан'];

(async () => {
  const user = await requireAuth();
  if (!user) return;

  if (user.email !== ADMIN_EMAIL) {
    document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;font-family:'Inter',sans-serif">
      <div style="font-size:48px">🔒</div>
      <div style="color:#ef4444;font-size:18px;font-weight:700">Рұқсат жоқ</div>
      <a href="dashboard.html" style="color:#38bdf8;font-size:14px">← Артқа</a>
    </div>`;
    return;
  }

  document.getElementById('userName').textContent = user.user_metadata?.name || user.email;
  await loadUsers();
})();

async function loadUsers() {
  const { data, error } = await sb.rpc('get_all_profiles');
  if (error) {
    document.getElementById('usersBody').innerHTML =
      `<tr><td colspan="6" class="table-empty">Қате: ${error.message}</td></tr>`;
    return;
  }
  allUsers = data || [];
  updateStats(allUsers);
  renderTable(allUsers);
}

function updateStats(users) {
  const today   = new Date().toISOString().slice(0, 10);
  const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString();
  const d = new Date();

  document.getElementById('statTotal').textContent = users.length;
  document.getElementById('statToday').textContent = users.filter(u => u.created_at?.slice(0, 10) === today).length;
  document.getElementById('statWeek').textContent  = users.filter(u => u.created_at >= weekAgo).length;
  document.getElementById('statDate').textContent  = `${d.getDate()} ${MONTHS[d.getMonth()]}`;
}

function renderTable(users) {
  const tbody = document.getElementById('usersBody');
  if (!users.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="table-empty">Пайдаланушылар жоқ</td></tr>`;
    return;
  }
  tbody.innerHTML = users.map((u, i) => {
    const date = u.created_at
      ? new Date(u.created_at).toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' })
      : '—';
    return `<tr>
      <td style="color:var(--muted);font-size:12px">${i + 1}</td>
      <td class="td-name">${u.name || '—'}</td>
      <td class="td-email">${u.email || '—'}</td>
      <td class="td-phone">${u.phone || '—'}</td>
      <td class="td-date">${date}</td>
      <td>${u.is_admin ? '<span class="badge-admin">Админ</span>' : ''}</td>
    </tr>`;
  }).join('');
}

function filterUsers() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  renderTable(q ? allUsers.filter(u =>
    (u.name || '').toLowerCase().includes(q) ||
    (u.email || '').toLowerCase().includes(q) ||
    (u.phone || '').includes(q)
  ) : allUsers);
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}
</script>
<script src="math-bg.js"></script>
</body>
</html>
