<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoTAB — Парольді қалпына келтіру</title>
<link rel="stylesheet" href="gotab.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html"><img src="gotab_logo.png" alt="GoTAB"></a>
    </div>
    <h1 class="auth-title">Парольді қалпына келтіру</h1>
    <p class="auth-sub" id="subText">Email-іңізді енгізіңіз, сілтеме жіберейік</p>

    <div class="error-msg" id="errMsg"></div>
    <div class="error-msg" id="okMsg" style="background:#d1fae5;color:#065f46;border-color:#6ee7b7;display:none"></div>

    <form id="resetForm" onsubmit="handleReset(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="emailInput" placeholder="example@mail.com" required>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Сілтеме жіберу</button>
    </form>

    <div class="auth-switch">
      <a href="login.html">← Кіру бетіне оралу</a>
    </div>
  </div>
</div>

<script src="supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
async function handleReset(e) {
  e.preventDefault();
  const errMsg   = document.getElementById('errMsg');
  const okMsg    = document.getElementById('okMsg');
  const btn      = document.getElementById('submitBtn');
  const email    = document.getElementById('emailInput').value.trim().toLowerCase();

  errMsg.style.display = 'none';
  okMsg.style.display  = 'none';
  btn.textContent = 'Жіберілуде...';
  btn.disabled = true;

  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/reset-password.html'
  });

  btn.textContent = 'Сілтеме жіберу';
  btn.disabled = false;

  if (error) {
    errMsg.textContent = 'Қате орын алды. Кейінірек қайталаңыз.';
    errMsg.style.display = 'block';
    return;
  }

  document.getElementById('resetForm').style.display = 'none';
  document.getElementById('subText').style.display = 'none';
  okMsg.innerHTML = '✅ <strong>' + email + '</strong> адресіне сілтеме жіберілді.<br>Email-іңізді тексеріңіз (spam қалтасын да).';
  okMsg.style.display = 'block';
}
</script>
</body>
</html>
