body{overflow:hidden}

.st>b{display:block;font-size:15px;margin-bottom:6px}
.gh{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px}.gh:first-of-type{margin-top:2px}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.task{padding:8px 9px;min-height:52px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-family:inherit;color:var(--text);cursor:pointer;text-align:left;line-height:1.2}
.task b{display:block;font-size:14px;font-weight:800}.task small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.task.on{border-color:var(--primary);background:rgba(26,86,219,.08)}.task.on b{color:var(--primary)}
.task.ok b::after{content:' ✓';color:var(--success)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:42px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--border);background:#fff;font:700 13px Inter,sans-serif;color:var(--text);cursor:pointer}
.chip.on{border-color:var(--primary);background:rgba(26,86,219,.08);color:var(--primary)}
#q{font-size:15px;line-height:1.5;padding:12px 14px;border-radius:12px;background:rgba(26,86,219,.06);margin-bottom:4px}
#q .fg{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);margin-top:8px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:14px;height:6px;border-radius:3px;display:inline-block}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:none;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-top:8px;min-height:48px}
.btn.p{background:linear-gradient(135deg,var(--primary),var(--cyan));color:#fff}.btn.g{background:#fff;border:1.5px solid var(--border);color:var(--text)}
.btn:disabled{opacity:.4;cursor:default}
.bar{display:flex;gap:8px}.bar .btn{margin-top:8px}
#ans{display:none;margin-top:10px;padding:12px 14px;border-radius:12px;background:rgba(16,185,129,.1);color:#065f46;font-size:14px;line-height:1.55}
#ans.on{display:block}#ans .big{display:block;font-size:22px;font-weight:900;color:#047857;margin-bottom:6px}
#seg{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;border:1.5px dashed #16a34a;font-size:14px;line-height:1.45;color:#14532d}#seg.on{display:block}
#finfo{margin-top:10px;padding:10px 12px;border-radius:10px;border:1.5px dashed var(--border);font-size:14px;line-height:1.5}
#finfo .big{display:block;font-size:22px;font-weight:900;color:#047857}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:8px}
svg.i{width:20px;height:20px;flex-shrink:0}
#tip{display:flex;align-items:center;gap:8px;position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(15,23,42,.88);color:#fff;border-radius:12px;padding:10px 18px;font-size:15px;font-weight:700;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}

.hide{display:none!important}
@media(max-width:820px){.lab{flex-direction:column;height:auto}#view{height:62vh}.side{width:auto;border-left:none}body{overflow:auto}#tip{font-size:13px}}

  else { const pr = prob(), ex = exact(r.d) || '≈ ' + approx(r.d);
    if (r.pp) info = r.d < 1e-6 ? `<b>${pr.p}</b> нүктесі (${pr.pl}) жазықтығында жатыр — қашықтық 0.` : `${pr.p} нүктесінен (${pr.pl}) жазықтығына дейінгі қашықтық:<span class="big">${segName(r)} = ${ex}</span>${/√/.test(ex) ? '≈ ' + approx(r.d) : ''}`;
    else info = r.cross ? `${pr.l1} мен ${pr.l2} қиылысады — арақашықтық 0.` : `${pr.l1} мен ${pr.l2} — ${r.par ? 'параллель' : 'айқас'} түзулер. Арақашықтық:<span class="big">${segName(r)} = ${ex}</span>${/√/.test(ex) ? '≈ ' + approx(r.d) : ''}`;
    tip = `${ic('check')}${r.d < 1e-6 ? 'Қашықтық 0' : segName(r) + ' = ' + ex} · жаңадан бастау үшін нүктені бас`; }
  $('finfo').innerHTML = info; $('tip').innerHTML = tip; }

// ---------- actions ----------
let fly = null; function flyTo(to, tg) { fly = { from: camera.position.clone(), to, t0: controls.target.clone(), t1: tg, t: 0 }; }
const home = () => { const tg = V(0, Y0, 0); flyTo(tg.clone().add(OFF), tg); };
const snd = k => window.labSound?.[k]?.();
function openTask(i) { S.task = i; S.step = 0; S.grow = 1; const k = T[i].f; if (k !== S.fig || !built) { S.fig = k; setFig(k); home(); } draw(); }
function setMode(m) { S.mode = m; $('mTask').classList.toggle('on', m === 'task'); $('mFree').classList.toggle('on', m === 'free'); $('taskPane').classList.toggle('hide', m !== 'task'); $('freePane').classList.toggle('hide', m !== 'free');
  if (m === 'task') openTask(S.task); else { S.sel = []; S.step = 0; draw(); } }
$('mTask').onclick = () => setMode('task'); $('mFree').onclick = () => setMode('free');
$('tasks').onclick = e => { const b = e.target.closest('.task'); if (b) { openTask(+b.dataset.i); snd('tap'); } };
$('perp').onclick = () => { S.step = 1; S.grow = 0; drawPerp(); ui(); snd('tap'); };
$('show').onclick = () => { if (S.step < 1) S.grow = 0; S.step = 2; S.done.add(S.task); drawPerp(); ui(); snd('done'); };
$('prev').onclick = () => S.task > 0 && openTask(S.task - 1); $('next').onclick = () => S.task < T.length - 1 && openTask(S.task + 1);
$('figs').innerHTML = Object.entries(FIG).map(([k, f]) => `<button class="chip" data-f="${k}">${f.s}</button>`).join('');
$('figs').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; S.fig = b.dataset.f; setFig(S.fig); S.sel = []; home(); draw(); };
$('fPP').onclick = () => { S.fm = 'pp'; S.sel = []; draw(); }; $('fLL').onclick = () => { S.fm = 'll'; S.sel = []; draw(); };
$('undo').onclick = () => { S.sel.pop(); S.step = 0; draw(); }; $('clear').onclick = () => { S.sel = []; S.step = 0; draw(); };
$('cam').onclick = home;
let spin = false; $('spin').onclick = () => { spin = !spin; controls.autoRotate = spin; controls.autoRotateSpeed = 1.6; $('spin').classList.toggle('p', spin); $('spin').classList.toggle('g', !spin); };

// free mode: tap a vertex (or O, E) — nearest labelled point on screen
function scr(v) { const rc = renderer.domElement.getBoundingClientRect(), p = W(v).project(camera); return [(p.x + 1) / 2 * rc.width + rc.left, (1 - p.y) / 2 * rc.height + rc.top]; }
function pick(e) { let best = null; const R = e.pointerType === 'touch' ? 44 : 30;
  for (const [n, v] of Object.entries(F.P)) { const [x, y] = scr(v), d = Math.hypot(x - e.clientX, y - e.clientY); if (d < R && (!best || d < best.d)) best = { n, d }; } return best?.n || null; }
const act = new Set(); let down = null, multi = false;
renderer.domElement.addEventListener('pointerdown', e => { act.add(e.pointerId); if (act.size > 1) { multi = true; down = null; } else { multi = false; down = { id: e.pointerId, x: e.clientX, y: e.clientY, touch: e.pointerType === 'touch' }; } }, { capture: true });
renderer.domElement.addEventListener('pointercancel', e => { act.delete(e.pointerId); down = null; if (!act.size) multi = false; });
renderer.domElement.addEventListener('pointermove', e => { if (S.mode !== 'free' || e.buttons || e.pointerType === 'touch') return; const h = pick(e); if (h !== S.hover) { S.hover = h; draw(); } });
renderer.domElement.addEventListener('pointerup', e => { const st = down; down = null; act.delete(e.pointerId); if (multi) { if (!act.size) multi = false; return; }
  if (S.mode !== 'free' || !st || st.id !== e.pointerId || Math.hypot(e.clientX - st.x, e.clientY - st.y) > (st.touch ? 14 : 6)) return;
  const n = pick(e); if (!n) return; if (S.sel.length >= 4) { S.sel = []; S.step = 0; }
  const dupe = S.fm === 'pp' ? S.sel.includes(n) : (S.sel.length % 2 === 1 && S.sel[S.sel.length - 1] === n);
  if (dupe) { snd('no'); $('tip').innerHTML = ic('warn') + 'Бұл нүкте таңдалып қойған — басқасын бас'; return; }
  S.sel.push(n); S.hover = null; if (S.sel.length === 4) { S.step = 2; S.grow = 0; snd('done'); } else snd('tap'); draw(); });

setFig(S.fig); { const tg = V(0, Y0, 0); controls.target.copy(tg); camera.position.copy(tg.clone().add(OFF)); }
buildTasks(); openTask(0);
(function loop() { requestAnimationFrame(loop);
  if (fly) { fly.t = Math.min(1, fly.t + 1 / 50); const k = fly.t < .5 ? 2 * fly.t * fly.t : 1 - Math.pow(-2 * fly.t + 2, 2) / 2; camera.position.lerpVectors(fly.from, fly.to, k); controls.target.lerpVectors(fly.t0, fly.t1, k); if (fly.t >= 1) fly = null; }
  if (S.grow < 1) { S.grow = Math.min(1, S.grow + 1 / 45); drawPerp(); }
  controls.update(); renderer.render(scene, camera); labels.render(scene, camera); })();
</script>
