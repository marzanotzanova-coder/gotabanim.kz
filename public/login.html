<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoTAB — Кіру</title>
<link rel="stylesheet" href="gotab.css">
<link rel="stylesheet" href="teacher-theme.css?v=20261102">
<script src="teacher-ui.js?v=20261102" defer></script>
</head>
<body class="teacher-app">
<script src="gotab-loader.js?v=20261112"></script>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html"><img src="gotab_logo_anim.webp" onerror="this.onerror=null;this.src='gotab_logo.png'" alt="GoTAB"></a>
    </div>
    <h1 class="auth-title">Жүйеге кіру</h1>
    <p class="auth-sub">GoTAB мұғалімдер платформасына қош келдіңіз</p>

    <div class="error-msg" id="errMsg"></div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="emailInput" placeholder="example@mail.com" required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="passInput" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Кіру</button>
    </form>

    <div class="auth-switch" style="margin-top:12px">
      <a href="forgot-password.html">Парольді ұмыттыңыз ба?</a>
    </div>
    <div class="auth-switch">
      Аккаунт жоқ па? <a href="register.html">Тіркелу</a>
    </div>
  </div>
</div>

<script src="supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
redirectIfLoggedIn();

// Бан хабарламасы
if (new URLSearchParams(location.search).get('banned') === '1') {
  const e = document.getElementById('errMsg');
  e.textContent = '🚫 Сіздің аккаунтіңіз блокталған. Қосымша ақпарат үшін хабарласыңыз.';
  e.style.display = 'block';
}

async function handleLogin(e) {
  e.preventDefault();
  const errMsg = document.getElementById('errMsg');
  const btn    = document.getElementById('submitBtn');
  const email  = document.getElementById('emailInput').value.trim().toLowerCase();
  const password = document.getElementById('passInput').value;

  errMsg.style.display = 'none';
  btn.textContent = 'Жүктелуде...';
  btn.disabled = true;

  const { error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    errMsg.textContent = 'Email немесе пароль қате';
    errMsg.style.display = 'block';
    btn.textContent = 'Кіру';
    btn.disabled = false;
    return;
  }

  window.location.href = 'dashboard.html';
}
</script>
<script src="math-bg.js"></script>
</body>
</html>
