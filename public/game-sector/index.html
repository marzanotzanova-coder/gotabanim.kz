    <div class="stats"><div>ҰПАЙ<b>${S.score}</b></div><div>ҚАЛҚАН<b>${S.shield}%</b></div><div>ҚАТЕСІЗ МИССИЯ<b>${S.log.filter(l => l.ok).length}/${S.list.length}</b></div><div>КЕҢЕС<b>${S.hints}</b></div></div>
    <div class="list">${S.log.map(l => `<div><b class="${l.ok ? 'y' : 'x'}">${l.ok ? '✓' : '✗'}</b><span><b style="color:#e5e9f0">${l.m.text}</b><br>${l.ans}</span></div>`).join('')}</div>
    <div class="row">${win && !last ? '<button class="b pri" id="dNext">КЕЛЕСІ МИССИЯ →</button>' : ''}<button class="b" id="dAgain">ҚАЙТАЛАУ</button><button class="b" id="dMenu">МӘЗІР</button></div>`, 'menu');
  if ($('dNext')) $('dNext').onclick = () => { AU.sfx('confirm'); startLevel(S.lv + 1); };
  $('dAgain').onclick = () => { AU.sfx('confirm'); startLevel(S.lv); }; $('dMenu').onclick = () => { AU.sfx('select'); menu(); };
  if (win) { const G = geo(); for (let i = 0; i < 6; i++) setTimeout(() => burst(G.cx + (Math.random() - .5) * G.R * 2, G.cy + (Math.random() - .5) * G.R * 2, i % 2 ? '#2dd4bf' : '#f5a524', 40, 6), i * 200); }
}

// ---------------- input ----------------
function nearest(e) { const G = geo(); let best = null, bd = Math.max(26, G.R * .18); for (const k of PTS) { const [x, y] = P(k, G.R, G), d = Math.hypot(e.clientX - x, e.clientY - y); if (d < bd) { bd = d; best = k; } } return best; }
cv.addEventListener('pointermove', e => { if (state !== 'mission') return; const k = nearest(e); if (k !== S.hover && k !== null && S.phase === 'arc') AU.sfx('move'); S.hover = k; cv.style.cursor = k !== null && S.phase === 'arc' ? 'pointer' : 'default'; });
cv.addEventListener('pointerdown', e => { if (state === 'mission') { const k = nearest(e); if (k !== null) pickPoint(k); } });
$('boot').addEventListener('pointerdown', () => { if (state === 'boot') bootSeq(); });
addEventListener('keydown', e => { if (state === 'boot' && (e.key === 'Enter' || e.key === ' ')) return bootSeq(); if (state !== 'mission') return;
  if (S.phase === 'form' && '1234'.includes(e.key)) { const b = $('opts').children[+e.key - 1]; if (b) b.click(); }
  if (e.key.toLowerCase() === 'h') hint(); if (e.key === 'Escape') clearSel(); });
const sync = () => { $('bMusic').classList.toggle('off', !AU.musicOn); $('bFx').classList.toggle('off', !AU.fxOn); };
$('bMusic').onclick = () => { AU.toggleMusic(); sync(); }; $('bFx').onclick = () => { AU.toggleFx(); sync(); }; sync();
$('bMenu').onclick = () => { if (state === 'mission' && !confirm('Миссиядан шығып, мәзірге ораламыз ба?')) return; AU.sfx('select'); menu(); };
document.addEventListener('visibilitychange', () => document.hidden ? AU.pause() : AU.resume());

// ---------------- loop ----------------
let last = performance.now(), flash = 0;
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  grow = state === 'boot' ? .35 + Math.sin(clock) * .02 : Math.min(1, grow + dt * 1.4);
  if (state === 'mission' && S.phase !== 'sweep') { S.t += dt; const left = Math.max(0, LEVELS[S.lv].T - S.t), el = $('time'), w = Math.ceil(left);
    if (el.textContent !== String(w)) { el.textContent = w; if (left <= 10 && left > 0) AU.sfx('tick'); } el.classList.toggle('low', left <= 10); if (left <= 0) timeUp(); }
  draw(dt);
  if (flash > 0) { g.fillStyle = `rgba(244,63,94,${flash * .18})`; g.fillRect(0, 0, W, H); flash = Math.max(0, flash - dt * 2.5); }
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);
if (location.hostname === 'localhost') window.__sec = { S, get state() { return state; }, missions, mission, options, interval, fa, satisfies, startLevel, pickPoint, LEVELS, A, rad };
})();
</script>
