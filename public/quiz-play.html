<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GoTAB — Ойын</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#001a33;--bg2:#003875;
  --acc:#00d4ff;--acc2:#0076b6;
  --txt:#e0f4ff;--muted:rgba(224,244,255,.6);
  --card:rgba(0,60,120,.45);--border:rgba(0,212,255,.3);
  --ok:#00ff9d;--bad:#ff4d6d;
  --shadow:rgba(0,212,255,.3);
  --particle:rgba(255,255,255,.18);
}
[data-theme=cave]{
  --bg1:#0a0500;--bg2:#1a0e00;
  --acc:#ff8c00;--acc2:#c45a00;
  --txt:#ffe8c0;--muted:rgba(255,232,192,.6);
  --card:rgba(50,25,0,.55);--border:rgba(255,140,0,.35);
  --ok:#88ff44;--bad:#ff3333;
  --shadow:rgba(255,140,0,.4);
  --particle:rgba(255,180,0,.15);
}
[data-theme=space]{
  --bg1:#000005;--bg2:#0d0030;
  --acc:#c084fc;--acc2:#7c3aed;
  --txt:#f0e6ff;--muted:rgba(240,230,255,.6);
  --card:rgba(20,0,60,.5);--border:rgba(192,132,252,.3);
  --ok:#44ff88;--bad:#ff3366;
  --shadow:rgba(192,132,252,.4);
  --particle:rgba(255,255,255,.15);
}
[data-theme=forest]{
  --bg1:#010d01;--bg2:#0a3d0a;
  --acc:#44ff44;--acc2:#1a8c1a;
  --txt:#d0ffd0;--muted:rgba(208,255,208,.6);
  --card:rgba(0,40,0,.5);--border:rgba(68,255,68,.3);
  --ok:#ffff44;--bad:#ff4444;
  --shadow:rgba(68,255,68,.35);
  --particle:rgba(100,255,100,.15);
}
[data-theme=steppe]{
  --bg1:#7b3200;--bg2:#2e7d32;
  --acc:#ffd700;--acc2:#ff8c00;
  --txt:#fff8e1;--muted:rgba(255,248,225,.7);
  --card:rgba(80,40,0,.4);--border:rgba(255,215,0,.4);
  --ok:#88ff44;--bad:#ff4444;
  --shadow:rgba(255,215,0,.4);
  --particle:rgba(255,220,50,.15);
}
[data-theme=cyberpunk]{
  --bg1:#000010;--bg2:#0a001a;
  --acc:#00fff9;--acc2:#ff00ff;
  --txt:#e0ffff;--muted:rgba(224,255,255,.6);
  --card:rgba(0,10,40,.55);--border:rgba(0,255,249,.3);
  --ok:#00ff9d;--bad:#ff2d78;
  --shadow:rgba(0,255,249,.45);
  --particle:rgba(0,255,249,.12);
}
[data-theme=volcano]{
  --bg1:#1a0000;--bg2:#3d0800;
  --acc:#ff6600;--acc2:#cc2200;
  --txt:#ffe0c0;--muted:rgba(255,224,192,.6);
  --card:rgba(60,10,0,.6);--border:rgba(255,100,0,.4);
  --ok:#88ff44;--bad:#ff2222;
  --shadow:rgba(255,100,0,.5);
  --particle:rgba(255,100,0,.15);
}
[data-theme=arctic]{
  --bg1:#000d1a;--bg2:#001433;
  --acc:#00ff88;--acc2:#00a8cc;
  --txt:#e0fff5;--muted:rgba(224,255,245,.65);
  --card:rgba(0,20,50,.55);--border:rgba(0,255,136,.3);
  --ok:#00ff88;--bad:#ff4d6d;
  --shadow:rgba(0,255,136,.4);
  --particle:rgba(200,255,240,.15);
}
[data-theme=retro]{
  --bg1:#0a0015;--bg2:#100028;
  --acc:#39ff14;--acc2:#ff2d78;
  --txt:#f0f0f0;--muted:rgba(240,240,240,.6);
  --card:rgba(20,0,50,.6);--border:rgba(57,255,20,.3);
  --ok:#39ff14;--bad:#ff2d78;
  --shadow:rgba(57,255,20,.45);
  --particle:rgba(57,255,20,.1);
}
[data-theme=magic]{
  --bg1:#08001a;--bg2:#150040;
  --acc:#ffd700;--acc2:#c850ff;
  --txt:#f5f0ff;--muted:rgba(245,240,255,.65);
  --card:rgba(20,0,50,.5);--border:rgba(255,215,0,.35);
  --ok:#00ff88;--bad:#ff4466;
  --shadow:rgba(255,215,0,.45);
  --particle:rgba(255,215,0,.12);
}


body{font-family:'Inter',sans-serif;min-height:100vh;overflow:hidden;background:var(--bg1);color:var(--txt);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#themeLayer{position:fixed;inset:0;pointer-events:none;z-index:0;background:var(--bg1) center / cover no-repeat}
#themeLayer .quiz-motion{width:100%;height:100%;display:block}
#themeLayer::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,11,25,.3),rgba(4,11,25,.66))}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#flash{position:fixed;inset:0;pointer-events:none;z-index:55;opacity:0}
#flash.bad{animation:flashBad .45s}#flash.good{animation:flashGood .35s}
@keyframes flashBad{0%{opacity:1;background:radial-gradient(transparent 40%,rgba(255,40,70,.55))}100%{opacity:0}}
@keyframes flashGood{0%{opacity:1;background:rgba(255,255,255,.35)}100%{opacity:0}}
body.shake .screen.active{animation:shakeX .4s}
@keyframes shakeX{0%,100%{transform:translate(0)}20%{transform:translate(-10px,3px)}40%{transform:translate(9px,-3px)}60%{transform:translate(-6px,2px)}80%{transform:translate(4px,0)}}

/* screens */
.screen{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column}
.screen.active{display:flex}
.screen.play{padding:78px 16px 20px;justify-content:flex-start;gap:14px;overflow-y:auto}
#sLoad{background:rgba(0,0,0,.8)}.load-txt{color:var(--muted);font-size:14px}

/* intro */
#sIntro{text-align:center;gap:14px}
.intro-box{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:26px;padding:30px 28px 26px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4),0 0 40px var(--shadow);animation:popIn .5s}
.intro-ico{font-size:64px;line-height:1;filter:drop-shadow(0 0 18px var(--shadow));animation:bob 2.4s ease-in-out infinite}
.quiz-badge{display:inline-block;margin:12px 0 8px;padding:6px 16px;border:1px solid var(--border);border-radius:100px;font-size:11px;font-weight:800;color:var(--acc);letter-spacing:2px}
.quiz-title{font-size:clamp(22px,5vw,34px);font-weight:900;color:var(--txt);text-shadow:0 0 30px var(--shadow);line-height:1.15}
.mode-name{margin-top:8px;font-size:17px;font-weight:900;color:var(--acc)}
.mode-rule{margin:8px auto 0;font-size:14px;color:var(--muted);line-height:1.55;max-width:420px}
.quiz-meta{margin-top:10px;font-size:12.5px;color:var(--muted)}
.name-inp{margin-top:16px;width:100%;max-width:300px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:rgba(0,0,0,.25);color:var(--txt);font:700 15px Inter,sans-serif;text-align:center;-webkit-user-select:text;user-select:text}
.name-inp:focus{outline:none;border-color:var(--acc)}.name-inp::placeholder{color:var(--muted)}
.btn-start{margin-top:14px;padding:16px 50px;background:var(--acc);border:none;border-radius:16px;color:#000;font-size:19px;font-weight:900;cursor:pointer;font-family:inherit;animation:pulseBtn 2s infinite;letter-spacing:.5px}
.btn-start:hover{filter:brightness(1.1);transform:scale(1.04)}
.best-line{margin-top:10px;font-size:13px;font-weight:700;color:var(--acc);min-height:18px}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;z-index:40;display:none;align-items:center;gap:12px;padding:10px 16px;background:rgba(0,0,0,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.hud.active{display:flex}
.hb{width:38px;height:38px;flex-shrink:0;border:1px solid var(--border);border-radius:11px;background:rgba(255,255,255,.06);color:var(--txt);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hb.off{opacity:.4}
.hud-title{font-size:13px;font-weight:800;color:var(--acc);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-mid{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.hearts{display:flex;gap:2px;font-size:20px;flex-shrink:0}
.hearts span{transition:transform .3s,filter .3s;display:inline-block}.hearts span.lost{filter:grayscale(1) brightness(.5);transform:scale(.8)}
.hearts span.pop{animation:heartLose .6s}
@keyframes heartLose{0%{transform:scale(1.6)}40%{transform:scale(.6) rotate(-20deg)}100%{transform:scale(.8)}}
.hud-prog{flex:1;height:8px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;min-width:40px}
.hud-prog div{height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:5px;transition:width .4s;box-shadow:0 0 10px var(--acc)}
.combo{font-size:14px;font-weight:900;color:#ffd447;text-shadow:0 0 12px #ff8a00;min-width:44px;text-align:right;opacity:0;transition:opacity .3s}
.combo.on{opacity:1;animation:comboPulse .5s}
@keyframes comboPulse{0%{transform:scale(1.8)}100%{transform:scale(1)}}
.score{font-size:20px;font-weight:900;color:var(--txt);min-width:64px;text-align:right;font-variant-numeric:tabular-nums;text-shadow:0 0 12px var(--shadow)}
.score.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.25);color:var(--acc)}}

/* popups, banners, countdown */
.pop{position:fixed;z-index:70;pointer-events:none;font:900 26px Inter,sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4),0 0 16px var(--ok);transform:translate(-50%,-50%);animation:popUp 1s ease-out forwards;white-space:nowrap}
.pop.bad{color:var(--bad);text-shadow:0 2px 0 rgba(0,0,0,.4),0 0 16px var(--bad)}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
#banner{position:fixed;left:50%;top:21%;z-index:65;pointer-events:none;transform:translate(-50%,-50%);font:900 clamp(28px,6vw,52px)/1 Inter,sans-serif;color:#ffd447;text-shadow:0 4px 0 #b45309,0 0 30px #ff8a00;opacity:0;white-space:nowrap;text-align:center}
#banner.show{animation:bannerIn 1.3s forwards}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(2deg)}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
#count{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);pointer-events:none}
#count.on{display:flex}
#count b{font:900 min(36vw,200px)/1 Inter,sans-serif;color:var(--acc);text-shadow:0 0 50px var(--shadow),0 8px 0 rgba(0,0,0,.35);animation:countIn .8s forwards}
@keyframes countIn{0%{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.6);opacity:0}}

/* question card + choices (boss, lightning) */
.qcard{position:relative;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1.5px solid var(--border);border-radius:20px;padding:20px 24px 18px;max-width:720px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3);animation:cardIn .35s}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.qnum{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:2px;margin-bottom:8px}
.qtext{font-size:clamp(17px,3vw,24px);font-weight:800;color:var(--txt);line-height:1.35;overflow-wrap:anywhere}
.tbar{height:8px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:14px;overflow:hidden}
.tbar div{height:100%;width:100%;background:var(--acc);border-radius:5px}
.tbar.low div{background:var(--bad);box-shadow:0 0 12px var(--bad)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:720px;width:100%}
@media(max-width:560px){.choices{grid-template-columns:1fr}}
.ch{position:relative;padding:16px 18px;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:2px solid var(--border);border-radius:16px;color:var(--txt);font:700 16px/1.3 Inter,sans-serif;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;text-align:left;display:flex;align-items:center;gap:12px;min-height:62px;animation:cardIn .35s backwards}
.ch:nth-child(2){animation-delay:.05s}.ch:nth-child(3){animation-delay:.1s}.ch:nth-child(4){animation-delay:.15s}
.ch:hover:not(:disabled){background:rgba(255,255,255,.12);border-color:var(--acc);transform:translateY(-3px)}
.ch:active:not(:disabled){transform:scale(.97)}
.ch:disabled{cursor:default}
.ch .ltr{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0;color:var(--acc)}
.ch .tx{overflow-wrap:anywhere}
.ch.ok{background:rgba(0,255,157,.18);border-color:var(--ok);color:var(--ok);box-shadow:0 0 24px rgba(0,255,157,.3);animation:okPop .4s}
.ch.no{background:rgba(255,77,109,.14);border-color:var(--bad);color:var(--bad);animation:shakeX .4s}
.ch:disabled:not(.ok):not(.no){opacity:.45}
@keyframes okPop{50%{transform:scale(1.05)}}

/* boss battle */
.arena{position:relative;width:100%;max-width:720px;height:clamp(150px,24vh,210px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 6%}
.fighter{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.fighter .body{font-size:clamp(58px,11vh,96px);line-height:1;filter:drop-shadow(0 0 18px var(--shadow));animation:bob 2.2s ease-in-out infinite}
#boss .body{font-size:clamp(76px,15vh,128px);animation-duration:1.7s}
.fighter .nm{font-size:11px;font-weight:900;letter-spacing:1.5px;color:var(--muted)}
.hp{width:clamp(110px,22vw,200px);height:12px;border-radius:7px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);overflow:hidden}
.hp div{height:100%;width:100%;background:linear-gradient(90deg,#ff3d5a,#ff9f43);transition:width .5s;border-radius:7px}
.fighter.hit .body{animation:hitShake .5s}
@keyframes hitShake{0%,100%{transform:translate(0)}20%{transform:translate(14px,-4px) rotate(8deg);filter:brightness(3) drop-shadow(0 0 20px #fff)}50%{transform:translate(-8px,2px) rotate(-5deg)}80%{transform:translate(4px,0)}}
#hero.hit .body{animation:heroHit .5s}
@keyframes heroHit{0%,100%{transform:none}30%{transform:translate(-14px,-4px) rotate(-10deg);filter:brightness(2) sepia(1) hue-rotate(-50deg) saturate(6)}}
#boss.dead .body{animation:bossDie 1.4s forwards}
@keyframes bossDie{0%{transform:none}30%{transform:rotate(-15deg) scale(1.2);filter:brightness(3)}100%{transform:rotate(90deg) translateY(60px) scale(.3);opacity:0}}
.vs{align-self:center;font:900 26px Inter,sans-serif;color:var(--acc);opacity:.5}
.shot{position:fixed;z-index:58;pointer-events:none;font-size:40px;line-height:1;transform:translate(-50%,-50%);filter:drop-shadow(0 0 14px #fff)}

/* lightning */
.qcard.fire{border-color:#ff8a00;box-shadow:0 0 30px rgba(255,138,0,.55),inset 0 0 30px rgba(255,138,0,.15)}
.qcard.fire::before{content:'🔥';position:absolute;top:-18px;right:-10px;font-size:34px;animation:bob 1s infinite}
.speed{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.speed .sec{font:900 30px Inter,sans-serif;color:var(--acc);font-variant-numeric:tabular-nums}
.speed .sec.low{color:var(--bad);animation:bump .5s infinite}

/* target (shooting gallery) */
#field{position:relative;width:min(900px,100%);flex:1;min-height:300px;border-radius:20px;border:1.5px solid var(--border);background:radial-gradient(ellipse at 50% 120%,rgba(255,255,255,.08),rgba(0,0,0,.25));overflow:hidden;cursor:crosshair;touch-action:none}
.bl{position:absolute;left:0;top:0;min-width:96px;max-width:200px;padding:14px 16px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;color:#fff;font:800 14px/1.25 Inter,sans-serif;text-align:center;box-shadow:inset -8px -10px 0 rgba(0,0,0,.16),inset 6px 6px 0 rgba(255,255,255,.25),0 8px 20px rgba(0,0,0,.35);cursor:crosshair;overflow-wrap:anywhere;will-change:transform}
.bl::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:34px;background:rgba(255,255,255,.45);transform:translateX(-50%)}
.bl.ok{box-shadow:0 0 0 4px var(--ok),0 0 30px var(--ok)}
.bl.popd{animation:popOut .35s forwards}.bl.no{filter:grayscale(1);animation:popOut .5s forwards}
@keyframes popOut{0%{transform:var(--tf) scale(1)}40%{transform:var(--tf) scale(1.35)}100%{transform:var(--tf) scale(0);opacity:0}}
#cross{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none;border:3px solid var(--acc);border-radius:50%;box-shadow:0 0 14px var(--acc);display:none;z-index:5}
#cross::before,#cross::after{content:'';position:absolute;background:var(--acc);left:50%;top:50%;transform:translate(-50%,-50%)}
#cross::before{width:62px;height:2px}#cross::after{width:2px;height:62px}
@media(pointer:fine){#field:hover #cross{display:block}}
.hole{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;background:radial-gradient(#000 35%,rgba(0,0,0,.4) 60%,transparent 70%);pointer-events:none;animation:fadeOut 1.5s forwards}
@keyframes fadeOut{70%{opacity:1}100%{opacity:0}}

/* memory */
.mbar{display:flex;gap:18px;font-size:14px;font-weight:800;color:var(--muted)}.mbar b{color:var(--txt)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;width:min(900px,100%)}
@media(max-width:560px){#grid{grid-template-columns:repeat(2,1fr);gap:9px}}
.mc{perspective:800px;height:104px;cursor:pointer;animation:dealIn .45s backwards}
@keyframes dealIn{from{opacity:0;transform:translateY(-40px) rotate(-10deg) scale(.6)}}
.mc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.open .in,.mc.done .in{transform:rotateY(180deg)}
.mc .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center}
.mc .bk{background:linear-gradient(135deg,var(--acc2),var(--acc));border:2px solid rgba(255,255,255,.35);box-shadow:0 6px 16px rgba(0,0,0,.35);flex-direction:column;gap:2px;color:#fff}
.mc .bk i{font-style:normal;font-size:32px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.25)}.mc .bk small{font-size:10px;font-weight:900;letter-spacing:1.5px;opacity:.85}
.mc.a .bk{background:linear-gradient(135deg,#7c3aed,#ec4899)}
.mc:hover:not(.open):not(.done) .in{transform:translateY(-4px) rotate(-2deg)}
.mc .fr{transform:rotateY(180deg);background:linear-gradient(var(--card),var(--card)),var(--bg1);border:2px solid var(--border);color:var(--txt);font:800 14px/1.3 Inter,sans-serif;overflow-wrap:anywhere;overflow:hidden}
.mc.done .fr{border-color:var(--ok);background:linear-gradient(rgba(0,255,157,.16),rgba(0,255,157,.16)),var(--bg1);color:var(--ok);box-shadow:0 0 20px rgba(0,255,157,.3)}
.mc.done{animation:matched .5s}.mc.miss{animation:shakeX .4s}.mc.miss .fr{border-color:var(--bad);color:var(--bad)}
@keyframes matched{50%{transform:scale(1.08)}}

/* flashcards */
.deck{position:relative;width:min(480px,92vw);height:clamp(220px,38vh,300px);margin-top:10px}
.fc{position:absolute;inset:0;perspective:1200px;touch-action:none}
.fc.ghost{transform:translateY(14px) scale(.94);opacity:.55;pointer-events:none}.fc.ghost2{transform:translateY(28px) scale(.88);opacity:.3;pointer-events:none}
.fc .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;background:linear-gradient(var(--card),var(--card)),var(--bg1);border:2px solid var(--border);box-shadow:0 14px 40px rgba(0,0,0,.4);font:800 clamp(17px,3.2vw,24px)/1.35 Inter,sans-serif;color:var(--txt);overflow-wrap:anywhere}
.fc .back{transform:rotateY(180deg);border-color:var(--ok)}
.fc .f small{position:absolute;top:16px;left:20px;font-size:10.5px;font-weight:900;letter-spacing:2px;color:var(--muted)}
.fc .stamp{position:absolute;top:22px;padding:6px 14px;border:4px solid;border-radius:12px;font:900 22px Inter,sans-serif;opacity:0;z-index:3;pointer-events:none}
.fc .stamp.y{right:22px;color:var(--ok);border-color:var(--ok);transform:rotate(12deg)}.fc .stamp.n{left:22px;color:var(--bad);border-color:var(--bad);transform:rotate(-12deg)}
.hint{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
.kbtns{display:flex;gap:14px}
.kb{padding:14px 26px;border-radius:16px;font:900 16px Inter,sans-serif;cursor:pointer;border:2px solid;min-width:150px}
.kb.n{background:rgba(255,77,109,.14);border-color:var(--bad);color:var(--bad)}.kb.y{background:rgba(0,255,157,.14);border-color:var(--ok);color:var(--ok)}
.kb:disabled{opacity:.3;cursor:default}.kb:hover:not(:disabled){transform:translateY(-2px)}
.round{font-size:12px;font-weight:900;letter-spacing:2px;color:var(--acc)}

/* sort conveyor */
#drop{position:relative;width:min(900px,100%);flex:1;min-height:220px;border-radius:20px 20px 8px 8px;border:1.5px solid var(--border);border-bottom:none;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.3));overflow:hidden}
#drop::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--bad) 0 14px,transparent 14px 28px);opacity:.7}
.item{position:absolute;left:50%;top:0;padding:14px 20px;max-width:min(320px,80%);border-radius:14px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:2px solid var(--acc);color:var(--txt);font:800 16px/1.3 Inter,sans-serif;text-align:center;box-shadow:0 0 22px var(--shadow),0 8px 18px rgba(0,0,0,.35);overflow-wrap:anywhere;will-change:transform}
.item.no{border-color:var(--bad);animation:shakeX .35s}
.baskets{display:flex;gap:10px;width:min(900px,100%);flex-wrap:wrap}
.bk2{flex:1 1 140px;min-height:84px;padding:12px 10px 10px;border-radius:8px 8px 18px 18px;border:2px solid var(--border);border-top:5px solid var(--acc);background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--txt);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .15s}
.bk2:hover{transform:translateY(-3px);border-color:var(--acc)}
.bk2 b{font-size:15px;font-weight:900;overflow-wrap:anywhere}.bk2 small{font-size:11px;color:var(--muted);font-weight:700}
.bk2 .k{font-size:10px;font-weight:900;color:var(--acc);opacity:.7}
.bk2.good{animation:okPop .4s;border-color:var(--ok);box-shadow:0 0 22px rgba(0,255,157,.35)}.bk2.bad{animation:shakeX .4s;border-color:var(--bad)}

/* results */
#sEnd{overflow-y:auto;justify-content:flex-start;padding-top:40px}
.end-box{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:26px;padding:26px 24px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 40px var(--shadow);animation:popIn .5s;margin:auto 0}
.end-ico{font-size:66px;line-height:1}
.end-title{font-size:clamp(24px,5vw,34px);font-weight:900;margin-top:8px;text-shadow:0 0 24px var(--shadow)}
.end-sub{font-size:14px;color:var(--muted);margin-top:4px}
.stars{display:flex;justify-content:center;gap:8px;margin:14px 0 4px;font-size:46px}
.stars span{filter:grayscale(1) brightness(.4);transform:scale(.6);transition:all .4s cubic-bezier(.3,1.8,.5,1)}
.stars span.on{filter:drop-shadow(0 0 14px #ffc300);transform:scale(1)}
.big-score{font:900 48px Inter,sans-serif;color:var(--acc);text-shadow:0 0 30px var(--shadow);font-variant-numeric:tabular-nums}
.rec{display:inline-block;margin-top:4px;padding:5px 14px;border-radius:99px;background:linear-gradient(135deg,#ffd447,#ff8a00);color:#3a1d00;font-size:13px;font-weight:900;animation:bump .8s 3}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.stats div{background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:14px;padding:10px 4px;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.5px}
.stats b{display:block;font-size:20px;color:var(--txt);margin-bottom:2px}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}}
.review{text-align:left;margin:4px 0 14px}
.review summary{cursor:pointer;font-size:14px;font-weight:800;color:var(--acc);padding:8px 0;text-align:center;list-style:none}
.review summary::-webkit-details-marker{display:none}
.review li{list-style:none;padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.22);margin-bottom:6px;font-size:13.5px;line-height:1.45;overflow-wrap:anywhere}
.review li b{color:var(--ok)}
.end-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn-replay{padding:14px 30px;background:var(--acc);border:none;border-radius:14px;color:#000;font:900 15px Inter,sans-serif;cursor:pointer}
.btn-ghost{padding:14px 22px;background:transparent;border:1.5px solid var(--border);border-radius:14px;color:var(--txt);font:800 14px Inter,sans-serif;cursor:pointer;text-decoration:none}
.btn-replay:hover,.btn-ghost:hover{filter:brightness(1.15);transform:translateY(-2px)}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulseBtn{0%,100%{box-shadow:0 0 0 0 var(--shadow)}50%{box-shadow:0 0 0 16px transparent}}
@keyframes popIn{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@media(max-width:600px){.hud{gap:8px;padding:8px 10px}.hud-title{display:none}.hearts{font-size:16px}.score{font-size:17px;min-width:50px}.hb{width:34px;height:34px}.screen.play{padding-top:66px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>

<body>
<div id="themeLayer"></div>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="banner"></div>
<div id="count"></div>

<!-- HUD -->
<div class="hud" id="hud">
  <button class="hb" id="bQuit" title="Шығу" aria-label="Шығу">✕</button>
  <div class="hud-title" id="hudTitle"></div>
  <div class="hud-mid"><div class="hearts" id="hearts"></div><div class="hud-prog"><div id="hudProg"></div></div></div>
  <div class="combo" id="combo"></div>
  <div class="score" id="score">0</div>
  <button class="hb" id="bMusic" title="Музыка" aria-label="Музыка">🎵</button>
  <button class="hb" id="bFx" title="Дыбыс" aria-label="Дыбыс">🔊</button>
</div>

<!-- Loading -->
<div class="screen active" id="sLoad">
  <img src="gotab_go_loader.webp" alt="" style="width:140px;height:auto;margin-bottom:16px">
  <div class="load-txt">Жүктелуде...</div>
</div>

<!-- Intro -->
<div class="screen" id="sIntro">
  <div class="intro-box">
    <div class="intro-ico" id="introIco">🎮</div>
    <div class="quiz-badge" id="introBadge">ВИКТОРИНА</div>
    <div class="quiz-title" id="introTitle"></div>
    <div class="mode-name" id="modeName"></div>
    <div class="mode-rule" id="modeRule"></div>
    <div class="quiz-meta" id="introMeta"></div>
    <input class="name-inp" id="pName" maxlength="24" placeholder="Атың (міндетті емес)" autocomplete="off">
    <div><button class="btn-start" id="btnStart">▶ ОЙНАУ</button></div>
    <div class="best-line" id="bestLine"></div>
  </div>
</div>

<!-- Quiz → boss battle -->
<div class="screen play" id="sBoss">
  <div class="arena">
    <div class="fighter" id="hero"><div class="nm" id="heroName">БАТЫР</div><div class="body">🦸</div></div>
    <div class="vs">VS</div>
    <div class="fighter" id="boss"><div class="hp"><div id="bossHp"></div></div><div class="body" id="bossBody">👾</div><div class="nm">БАСТЫҚ</div></div>
  </div>
  <div class="qcard"><div class="qnum" id="bNum"></div><div class="qtext" id="bText"></div><div class="tbar" id="bBar"><div></div></div></div>
  <div class="choices" id="bCh"></div>
</div>

<!-- Lightning marathon -->
<div class="screen play" id="sLight" style="justify-content:center">
  <div class="qcard" id="lCard"><div class="speed"><div class="qnum" id="lNum" style="margin:0"></div><div class="sec" id="lSec">10</div></div>
    <div class="qtext" id="lText"></div><div class="tbar" id="lBar"><div></div></div></div>
  <div class="choices" id="lCh"></div>
</div>

<!-- Target → shooting gallery -->
<div class="screen play" id="sTarget">
  <div class="qcard" style="padding:14px 20px"><div class="qnum" id="tNum"></div><div class="qtext" id="tText"></div><div class="tbar" id="tBar"><div></div></div></div>
  <div id="field"><div id="cross"></div></div>
</div>

<!-- Match → memory cards -->
<div class="screen play" id="sMemory">
  <div class="mbar"><span>Жүріс: <b id="mMoves">0</b></span><span>Уақыт: <b id="mTime">0:00</b></span><span id="mRound"></span></div>
  <div id="grid"></div>
</div>

<!-- Carousel → flashcards -->
<div class="screen play" id="sCards" style="justify-content:center">
  <div class="round" id="cRound">1-РАУНД</div>
  <div class="deck" id="deck"></div>
  <div class="hint" id="cHint">👆 Картаны басып, жауапты аш</div>
  <div class="kbtns"><button class="kb n" id="kNo" disabled>✗ Білмедім</button><button class="kb y" id="kYes" disabled>✓ Білемін</button></div>
</div>

<!-- Sort → conveyor -->
<div class="screen play" id="sSort">
  <div id="drop"></div>
  <div class="baskets" id="baskets"></div>
</div>

<!-- Results -->
<div class="screen" id="sEnd">
  <div class="end-box">
    <div class="end-ico" id="eIco">🏆</div>
    <div class="end-title" id="eTitle"></div>
    <div class="end-sub" id="eSub"></div>
    <div class="stars" id="eStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="big-score" id="eScore">0</div>
    <div id="eRec"></div>
    <div class="stats" id="eStats"></div>
    <details class="review" id="eReview"><summary></summary><ul></ul></details>
    <div class="end-btns"><button class="btn-replay" id="bAgain">🔄 Қайта ойнау</button><button class="btn-ghost" id="bShare">🔗 Бөлісу</button><a class="btn-ghost" href="games.html">← Ойындар</a></div>
  </div>
</div>

<script src="supabase.js"></script>
<script src="supabase-client.js?v=20261117-paid"></script>
<script src="quiz-game.js?v=20261124"></script>
</body>
