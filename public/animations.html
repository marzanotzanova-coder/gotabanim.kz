<!DOCTYPE html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoTAB — Анимациялар</title><link rel="stylesheet" href="gotab.css"><link rel="stylesheet" href="teacher-theme.css?v=20261103-animation"><script src="teacher-ui.js?v=20261102" defer></script><style>
/* glowing animation cards: each card has its own colours and a running light border */
@property --an-a{syntax:'<angle>';inherits:false;initial-value:0deg}
.teacher-app .animations-page h1{font-size:32px;font-weight:900;background:linear-gradient(90deg,#2563eb,#7c3aed,#db2777,#0891b2,#2563eb);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:an-text 6s linear infinite;display:inline-block}
.teacher-app .animation-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.teacher-app .animation-card{--c1:#22d3ee;--c2:#3b82f6;--c3:#818cf8;position:relative;padding:12px 12px 16px;border-radius:20px;border:2px solid transparent;
  background:linear-gradient(#fff,#fff) padding-box,conic-gradient(from var(--an-a),var(--c1),var(--c2),var(--c3),var(--c1)) border-box;
  animation:an-spin 5s linear infinite,an-glow 2.6s ease-in-out infinite alternate;animation-delay:0s,calc(var(--i,0) * -.45s);transition:transform .25s}
.teacher-app .animation-card:nth-child(5n+2){--c1:#c084fc;--c2:#ec4899;--c3:#8b5cf6}
.teacher-app .animation-card:nth-child(5n+3){--c1:#34d399;--c2:#06b6d4;--c3:#3b82f6}
.teacher-app .animation-card:nth-child(5n+4){--c1:#fbbf24;--c2:#f59e0b;--c3:#a855f7}
.teacher-app .animation-card:nth-child(5n+5){--c1:#60a5fa;--c2:#6366f1;--c3:#a78bfa}
.teacher-app .animation-card:hover{transform:translateY(-6px)}
.teacher-app .animation-card h3{font-size:15px;font-weight:800;color:#0f172a;margin:14px 4px 4px}
.teacher-app .animation-card p{margin:4px 4px 12px;font-weight:600;color:color-mix(in srgb,var(--c2) 75%,#334155)}
.teacher-app .animation-screen{position:relative;border-radius:14px;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c1) 55%,transparent),transparent 55%),radial-gradient(circle at 75% 80%,color-mix(in srgb,var(--c3) 55%,transparent),transparent 55%),linear-gradient(160deg,#0b1230,#151a4a);isolation:isolate}
.teacher-app .animation-screen::before{content:attr(data-title);position:absolute;left:14px;right:14px;top:18%;z-index:0;text-align:center;color:#fff;font-weight:900;font-size:19px;line-height:1.25;text-shadow:0 0 18px var(--c1),0 0 34px var(--c2);pointer-events:none}
.teacher-app .animation-screen::after{content:'';position:absolute;inset:0;z-index:0;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}
.teacher-app .animation-screen video{position:relative;z-index:2}
.teacher-app .animation-play{position:relative;z-index:1;width:68px;height:68px;border:none;color:#fff;background:linear-gradient(135deg,var(--c2),var(--c3));box-shadow:0 0 0 6px color-mix(in srgb,var(--c1) 30%,transparent),0 0 30px var(--c2);animation:an-pulse 1.6s ease-in-out infinite;margin-top:30%}
.teacher-app .animation-play svg{width:30px;height:30px;fill:currentColor}
.teacher-app .animation-lock{position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;background:#ffffffee;color:#2563eb;font-size:11px;font-weight:800}
.teacher-app .animation-card .btn-dl-sm{position:relative;overflow:hidden;display:block;width:100%;padding:11px;border:none;border-radius:12px;color:#fff;font-weight:800;font-size:13px;cursor:pointer;background:linear-gradient(135deg,var(--c2),var(--c3));box-shadow:0 6px 18px color-mix(in srgb,var(--c2) 40%,transparent)}
.teacher-app .animation-card .btn-dl-sm::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:an-shine 3.2s ease-in-out infinite;pointer-events:none}
.teacher-app #animationAccess{position:relative;overflow:hidden;margin-bottom:24px;border:2px solid transparent;border-radius:20px;color:#fff;font-weight:700;font-size:15px;
  background:linear-gradient(120deg,#1e3a8a,#5b21b6,#0e7490) padding-box,conic-gradient(from var(--an-a),#67e8f9,#c4b5fd,#f9a8d4,#fde68a,#67e8f9) border-box;animation:an-spin 4s linear infinite;box-shadow:0 10px 34px rgba(91,33,182,.3)}
.teacher-app #animationAccess .btn-solid{border:none;cursor:pointer;font:inherit;font-weight:800;color:#4c1d95;background:#fff;box-shadow:0 0 22px rgba(255,255,255,.55)}
@keyframes an-spin{to{--an-a:360deg}}
@keyframes an-glow{from{box-shadow:0 6px 18px color-mix(in srgb,var(--c2) 14%,transparent)}to{box-shadow:0 10px 30px color-mix(in srgb,var(--c2) 32%,transparent),0 0 24px color-mix(in srgb,var(--c1) 35%,transparent)}}
@keyframes an-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes an-shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes an-text{to{background-position:200% 0}}
</style></head><body class="teacher-app">
