<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoTAB — Мұғалім кабинеті</title>
<link rel="stylesheet" href="gotab.css">
<style>
.home{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
/* hero: greeting on a bright gradient with slowly floating math symbols */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:34px 36px;color:#fff;background:linear-gradient(120deg,#0b1f5c,#1a56db,#6d28d9,#0891b2,#0b1f5c);background-size:300% 300%;animation:hero-shift 18s ease-in-out infinite;box-shadow:0 22px 50px rgba(26,86,219,.32),0 0 0 1px rgba(255,255,255,.08) inset}
@keyframes hero-shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
/* soft glowing orbs and a light sweep that crosses the banner now and then */
.hero-orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;pointer-events:none;animation:hero-orb 16s ease-in-out infinite}
.hero-orb.o1{width:260px;height:260px;background:#22d3ee;right:-60px;top:-80px}
.hero-orb.o2{width:220px;height:220px;background:#a78bfa;left:30%;bottom:-120px;animation-delay:-6s}
.hero-orb.o3{width:160px;height:160px;background:#f472b6;right:28%;top:-60px;opacity:.35;animation-delay:-10s}
@keyframes hero-orb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,20px) scale(1.15)}}
.hero-shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);background-size:250% 100%;animation:hero-shine 7s ease-in-out infinite}
@keyframes hero-shine{0%,60%{background-position:150% 0}100%{background-position:-60% 0}}
.hero-top{display:flex;align-items:center;gap:16px}
.hero-ava{position:relative;width:68px;height:68px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#1a56db;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25),0 0 28px rgba(34,211,238,.7)}
.hero-ava::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:2px solid transparent;border-top-color:#67e8f9;border-right-color:#c4b5fd;animation:hero-ring 4s linear infinite}
@keyframes hero-ring{to{transform:rotate(360deg)}}
.hero-hi{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}
.hero-hi svg{width:15px;height:15px;color:#fde68a}
.hero-quote{margin-top:14px;display:flex;gap:10px;align-items:flex-start;max-width:620px;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:14px;line-height:1.5;font-style:italic}
.hero-quote b{font-style:normal;font-size:24px;line-height:1;color:#fde68a}
@media(prefers-reduced-motion:reduce){.hero,.hero-orb,.hero-shine,.hero-ava::after{animation:none}}

.hero-sym{position:absolute;font-weight:900;color:rgba(255,255,255,.13);pointer-events:none;animation:hm-float 9s ease-in-out infinite}
@keyframes hm-float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(6deg)}}
@media(prefers-reduced-motion:reduce){.hero-sym{animation:none}}
.hero-in{position:relative;z-index:1;max-width:700px}
.hero-date{font-size:13px;font-weight:700;letter-spacing:.4px;opacity:.85;text-transform:uppercase}
.hero h1{font-size:clamp(24px,3.4vw,34px);font-weight:900;line-height:1.2;margin:8px 0 8px;letter-spacing:-.5px}
.hero p{font-size:15px;opacity:.9;line-height:1.5}
.hero-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.hero-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;min-height:46px;border-radius:13px;background:#fff;color:#1a56db;font-weight:800;font-size:14px;text-decoration:none;box-shadow:0 6px 18px rgba(11,31,92,.25)}
.hero-btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:none}
.hero-btn svg,.hm-ic{width:18px;height:18px;flex-shrink:0}
.teacher-app .sub-nav{display:none} /* on the home page the sections live inside the banner */
.hero-nav{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:24px}
.hero-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px 8px;min-height:92px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;text-decoration:none;font-weight:800;font-size:14px;text-align:center;transition:background .2s,transform .2s;backdrop-filter:blur(6px)}
.hero-nav a:hover{background:rgba(255,255,255,.24);transform:translateY(-2px)}
.hero-nav svg{width:26px;height:26px;flex-shrink:0}
@media(max-width:760px){.hero-nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.hero-nav a{flex-direction:row;justify-content:flex-start;gap:8px;min-height:56px;font-size:13px;padding:10px 10px}.hero-nav a:last-child{grid-column:1/-1}.hero-nav svg{width:22px;height:22px}}
.hero-sub{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:rgba(16,185,129,.25);border:1px solid rgba(110,231,183,.5);font-size:12px;font-weight:800}
/* quick start: one row per subject, a small chip per grade opens the lessons straight away */
.hm-block{margin-top:26px}
.hm-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:900;color:var(--text);margin-bottom:12px}
.hm-title svg{width:20px;height:20px;color:var(--primary)}
.picker{background:#fff;border:1px solid var(--border);border-radius:20px;padding:8px 18px;box-shadow:0 4px 18px rgba(26,86,219,.06)}
.pk-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.pk-row:last-child{border-bottom:none}
.pk-name{display:flex;align-items:center;gap:10px;width:170px;flex-shrink:0;font-weight:800;font-size:15px;color:var(--text)}
.pk-name i{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;flex-shrink:0}
.pk-name i svg{width:18px;height:18px}
.pk-chips{display:flex;flex-wrap:wrap;gap:8px}
.pk-chip{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;min-height:40px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-weight:700;font-size:14px;text-decoration:none;transition:all .15s}
.pk-chip:hover{border-color:var(--primary);color:var(--primary);background:#fff;transform:translateY(-1px)}
.pk-chip.mine{border-color:rgba(26,86,219,.45);background:rgba(26,86,219,.08);color:var(--primary)}
.pk-chip.mine::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--primary)}
/* cabinet cards */
.cab-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:26px}
.cab-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:20px 22px;box-shadow:0 4px 18px rgba(26,86,219,.06)}
.cab-card.wide{grid-column:1/-1}
.cab-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cab-head i{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-style:normal;flex-shrink:0}
.cab-head i svg{width:20px;height:20px}
.cab-head h2{font-size:16px;font-weight:900;color:var(--text)}
.cab-empty{font-size:14px;color:var(--muted);line-height:1.5}
.cab-recent{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--surface2);text-decoration:none;color:var(--text)}
.cab-recent b{display:block;font-size:15px}.cab-recent span{font-size:13px;color:var(--muted)}
.cab-recent .go{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--cyan));color:#fff;font-weight:800;font-size:13px;white-space:nowrap}
.cab-more{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--border);color:var(--text);text-decoration:none;font-size:14px;font-weight:600}
.cab-more:last-child{border-bottom:none}.cab-more:hover{color:var(--primary)}
.cab-recent{margin-bottom:6px}
.new-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.new-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);text-decoration:none;color:var(--text);transition:border-color .15s,transform .15s}
.new-item:hover{border-color:var(--primary);transform:translateY(-1px)}
.new-item b{display:block;font-size:14px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.new-item span{font-size:12px;color:var(--muted)}
.new-item .new-pill{flex-shrink:0;padding:4px 9px;border-radius:99px;font-size:10px;font-weight:900;letter-spacing:.6px;color:#fff;background:linear-gradient(135deg,#f43f5e,#f59e0b)}
.cab-chips{display:flex;flex-wrap:wrap;gap:8px}
.cab-folder{border:1px solid var(--border);border-radius:14px;margin-top:8px;overflow:hidden}
.cab-folder summary{cursor:pointer;padding:12px 14px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;background:var(--surface2)}
.cab-folder summary svg{width:17px;height:17px;color:#f59e0b}
.cab-line{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border)}
.cab-line a{flex:1;color:var(--text);text-decoration:none;font-size:14px;font-weight:600}.cab-line a:hover{color:var(--primary)}
.cab-del{border:none;background:none;color:#94a3b8;cursor:pointer;padding:6px;border-radius:8px;display:flex}.cab-del:hover{color:#dc2626;background:rgba(220,38,38,.08)}
.cab-del svg{width:17px;height:17px}
@media(max-width:760px){.hero{padding:26px 22px}.hero-ava{width:54px;height:54px;font-size:19px}.hero-top{gap:12px}.cab-grid{grid-template-columns:1fr}.pk-row{flex-direction:column;align-items:flex-start;gap:10px}.pk-name{width:auto}}
</style>

<script>
// subject rows with grade chips; each chip opens the lessons of that grade directly
const PICK = [
  ['math', 'Математика', '#1a56db', '<line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>', [5, 6]],
  ['algebra', 'Алгебра', '#7c3aed', '<path d="M4 7V4h16v3M9 20h6M12 4v16"/>', [7, 8, 9, 10, 11]],
  ['geometry', 'Геометрия', '#0891b2', '<path d="M12 3 3 20h18z"/>', [7, 8, 9, 10, 11]],
  ['informatics', 'Информатика', '#059669', '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>', [5, 6, 7, 8, 9, 10, 11]]];
function renderPicker(mine = []) {
  const has = (g, s) => mine.some(r => r.grade === g && r.subject === s);
  document.getElementById('picker').innerHTML = PICK.map(([s, name, color, icon, grades]) => `<div class="pk-row">
    <div class="pk-name"><i style="background:${color}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg></i>${name}</div>
    <div class="pk-chips">${grades.map(g => `<a class="pk-chip${has(g, s) ? ' mine' : ''}" href="content.html?grade=${g}&subject=${s}">${g}-сынып</a>`).join('')}</div></div>`).join('');
}
renderPicker();
window.onCabinetClasses = renderPicker; // teacher-cabinet.js marks the teacher's own classes

const MONTHS = ['қаңтар', 'ақпан', 'наурыз', 'сәуір', 'мамыр', 'маусым', 'шілде', 'тамыз', 'қыркүйек', 'қазан', 'қараша', 'желтоқсан'];
const DAYS = ['жексенбі', 'дүйсенбі', 'сейсенбі', 'сәрсенбі', 'бейсенбі', 'жұма', 'сенбі'];
const now = new Date();
document.getElementById('heroDate').textContent = `${now.getDate()} ${MONTHS[now.getMonth()]}, ${DAYS[now.getDay()]}`;
// greeting by time of day and a Kazakh proverb that changes every day
const h = now.getHours(), SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
document.getElementById('heroHi').innerHTML = SUN + (h < 12 ? 'Қайырлы таң' : h < 18 ? 'Қайырлы күн' : 'Қайырлы кеш');
const PROVERBS = ['Білекті бірді жығар, білімді мыңды жығар.', 'Оқу — инемен құдық қазғандай.', 'Ұстазы жақсының ұстамы жақсы.', 'Талапты ерге нұр жауар.', 'Білім — таусылмас қазына.', 'Оқыған озар, оқымаған тозар.', 'Еңбек етсең ерінбей, тояды қарның тіленбей.'];
document.getElementById('heroQuote').textContent = PROVERBS[Math.floor(now / 864e5) % PROVERBS.length];

(async () => {
  const user = await requireAuth();
  if (!user) return;
  const name = user.user_metadata?.name || user.email;
  document.getElementById('userName').textContent = name;
  const teacherName = user.user_metadata?.name?.trim();
  document.querySelector('#greeting').textContent = 'Сәлеметсіз бе' + (teacherName ? ', ' + teacherName : '') + '!';
  document.getElementById('heroAva').textContent = (teacherName || name).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || 'G';
  void TeacherCabinet.dashboard(user);
  void showNewLessons();
  if (user.email === ADMIN_EMAIL) {
    const adminBtn = document.createElement('a');
    adminBtn.href = 'admin.html';
    adminBtn.textContent = 'Админ';
    adminBtn.style.cssText = 'padding:7px 16px;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);border-radius:8px;color:#c4b5fd;font-size:13px;font-weight:700;text-decoration:none';
    document.querySelector('.nav-user').prepend(adminBtn);
    return;
  }
  // subscription end date in the greeting
  try {
    const { data } = await sb.rpc('check_my_subscription'); const r = Array.isArray(data) ? data[0] : data;
    if (r?.is_paid && r.paid_until && new Date(r.paid_until) > now) {
      const d = new Date(r.paid_until);
      document.getElementById('heroRow').insertAdjacentHTML('beforeend', `<span class="hero-sub"><svg class="hm-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Жазылым ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()} дейін</span>`);
    }
  } catch (_) {}
})();

// lessons added during the last 7 days, newest first
const SUBJ = { math: 'Математика', algebra: 'Алгебра', geometry: 'Геометрия', informatics: 'Информатика' };
async function showNewLessons() {
  try {
    const since = new Date(Date.now() - 7 * 864e5).toISOString();
    const { data, error } = await sb.from('materials').select('grade,subject,lesson_num,title,created_at').gte('created_at', since).order('created_at', { ascending: false }).limit(12);
    if (error || !data?.length) return;
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    document.getElementById('newList').innerHTML = data.map(r => `<a class="new-item" href="content.html?grade=${r.grade}&subject=${encodeURIComponent(r.subject)}#sabak-${r.lesson_num}"><span class="new-pill">ЖАҢА</span><div><b>${esc(r.title)}</b><span>${r.grade}-сынып · ${SUBJ[r.subject] || ''} · ${r.lesson_num}-сабақ</span></div></a>`).join('');
    document.getElementById('cabNew').hidden = false;
  } catch (_) {}
}

async function logout() {
  localStorage.removeItem('gotab_last_page');
  await sb.auth.signOut();
  window.location.href = 'index.html';
}
