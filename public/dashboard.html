<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoTAB — Сынып таңдаңыз</title>
<link rel="stylesheet" href="gotab.css">
</head>
<body>
<nav class="top-nav">
  <img src="gotab_logo.png" alt="GoTAB">
  <div class="nav-user">
    <span class="nav-user-name" id="userName"></span>
    <button class="btn-logout" onclick="logout()">Шығу</button>
  </div>
</nav>

<div class="sub-nav">
  <a href="dashboard.html" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Материалдар
  </a>
  <a href="visuals.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    Көрнекіліктер
  </a>
  <a href="games.html" class="active-game">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15.5" cy="11" r="0.5" fill="currentColor"/><circle cx="17.5" cy="13" r="0.5" fill="currentColor"/><path d="M6 20h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2z"/></svg>
    Ойындар
  </a>
</div>

<div class="dash-page">
  <div class="dash-header">
    <h1>GoTAB мұғалімдерге</h1>
    <p>Сынып пен пәнді таңдап, материалдарға кіріңіз</p>
  </div>

  <div class="dash-section">
    <div class="dash-section-title">Сынып таңдаңыз</div>
    <div class="grade-grid">
      <button class="grade-btn" onclick="selectGrade(5)">5-сынып</button>
      <button class="grade-btn" onclick="selectGrade(6)">6-сынып</button>
      <button class="grade-btn" onclick="selectGrade(7)">7-сынып</button>
      <button class="grade-btn" onclick="selectGrade(8)">8-сынып</button>
      <button class="grade-btn" onclick="selectGrade(9)">9-сынып</button>
      <button class="grade-btn" onclick="selectGrade(10)">10-сынып</button>
      <button class="grade-btn" onclick="selectGrade(11)">11-сынып</button>
    </div>
  </div>

  <div class="dash-section subject-section" id="subjectSection">
    <div class="dash-section-title">Пән таңдаңыз</div>
    <div class="subject-grid" id="subjectsMath56" style="display:none">
      <button class="subject-btn" onclick="selectSubject('math')">Математика</button>
    </div>
    <div class="subject-grid" id="subjectsAlgGeo" style="display:none">
      <button class="subject-btn" onclick="selectSubject('algebra')">Алгебра</button>
      <button class="subject-btn" onclick="selectSubject('geometry')">Геометрия</button>
    </div>
  </div>

  <div class="dash-continue">
    <button id="continueBtn" onclick="goToContent()" disabled>Жалғастыру →</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
let selectedGrade = null, selectedSubject = null;

(async () => {
  const user = await requireAuth();
  if (!user) return;
  const name = user.user_metadata?.name || user.email;
  document.getElementById('userName').textContent = name;
  if (user.email === ADMIN_EMAIL) {
    const adminBtn = document.createElement('a');
    adminBtn.href = 'admin.html';
    adminBtn.textContent = 'Админ';
    adminBtn.style.cssText = 'padding:7px 16px;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);border-radius:8px;color:#c4b5fd;font-size:13px;font-weight:700;text-decoration:none';
    document.querySelector('.nav-user').prepend(adminBtn);
  }
})();

async function logout() {
  localStorage.removeItem('gotab_last_page');
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

function selectGrade(grade) {
  selectedGrade = grade; selectedSubject = null;
  document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('subjectSection').classList.add('visible');
  const math56  = document.getElementById('subjectsMath56');
  const algGeo  = document.getElementById('subjectsAlgGeo');
  if (grade <= 6) { math56.style.display = 'flex'; algGeo.style.display = 'none'; }
  else            { math56.style.display = 'none';  algGeo.style.display = 'flex'; }
  document.getElementById('continueBtn').disabled = true;
}

function selectSubject(subject) {
  selectedSubject = subject;
  document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('continueBtn').disabled = false;
}

function goToContent() {
  if (!selectedGrade || !selectedSubject) return;
  window.location.href = `content.html?grade=${selectedGrade}&subject=${selectedSubject}`;
}
</script>
<script src="math-bg.js"></script>
</body>
</html>
