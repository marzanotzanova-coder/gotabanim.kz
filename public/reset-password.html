<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoTAB — Жаңа пароль</title>
<link rel="stylesheet" href="gotab.css">
<link rel="stylesheet" href="teacher-theme.css?v=20261102">
<script src="teacher-ui.js?v=20261102" defer></script>
</head>
<body class="teacher-app">
<script src="gotab-loader.js?v=20261112"></script>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html"><img src="gotab_logo_anim.webp" onerror="this.onerror=null;this.src='gotab_logo.png'" alt="GoTAB"></a>
    </div>
    <h1 class="auth-title">Жаңа пароль орнату</h1>
    <p class="auth-sub">Жаңа парольді енгізіңіз</p>

    <div class="error-msg" id="errMsg"></div>
    <div class="error-msg" id="okMsg" style="background:#d1fae5;color:#065f46;border-color:#6ee7b7;display:none"></div>

    <form id="newPassForm" onsubmit="handleNewPassword(event)">
      <div class="form-group">
        <label>Жаңа пароль</label>
        <input type="password" id="passInput" placeholder="••••••••" minlength="6" required>
      </div>
      <div class="form-group">
        <label>Парольді растау</label>
        <input type="password" id="passConfirm" placeholder="••••••••" minlength="6" required>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Парольді сақтау</button>
    </form>

    <div class="auth-switch">
      <a href="login.html">← Кіру бетіне оралу</a>
    </div>
  </div>
</div>

<script src="supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
// Supabase автоматически обрабатывает токен из URL-фрагмента (#access_token=...)
// Нужно только слушать событие PASSWORD_RECOVERY
sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    // Сессия установлена, форма готова
  }
});

async function handleNewPassword(e) {
  e.preventDefault();
  const errMsg  = document.getElementById('errMsg');
  const okMsg   = document.getElementById('okMsg');
  const btn     = document.getElementById('submitBtn');
  const pass    = document.getElementById('passInput').value;
  const confirm = document.getElementById('passConfirm').value;

  errMsg.style.display = 'none';
  okMsg.style.display  = 'none';

  if (pass !== confirm) {
    errMsg.textContent = 'Парольдер сәйкес келмейді';
    errMsg.style.display = 'block';
    return;
  }

  btn.textContent = 'Сақталуда...';
  btn.disabled = true;

  const { error } = await sb.auth.updateUser({ password: pass });

  btn.textContent = 'Парольді сақтау';
  btn.disabled = false;

  if (error) {
    errMsg.textContent = 'Қате орын алды. Сілтеме ескірген болуы мүмкін — қайтадан сұраңыз.';
    errMsg.style.display = 'block';
    return;
  }

  document.getElementById('newPassForm').style.display = 'none';
  okMsg.textContent = '✅ Пароль сәтті өзгертілді! Кіруге болады.';
  okMsg.style.display = 'block';

  setTimeout(() => { window.location.href = 'login.html'; }, 2500);
}
</script>
</body>
</html>
