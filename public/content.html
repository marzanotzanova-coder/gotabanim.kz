<html lang="kk">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoTAB — Материалдар</title>
<link rel="stylesheet" href="gotab.css">
<style>
/* ── TOP PAYMENT BAR ── */
.pay-bar{
  background:linear-gradient(135deg,rgba(14,165,233,.10),rgba(6,182,212,.07));
  border-bottom:1px solid rgba(14,165,233,.18);
  padding:11px 24px;
  display:flex;align-items:center;justify-content:center;gap:14px;
  flex-wrap:wrap;
  position:sticky;top:57px;z-index:90;
  backdrop-filter:blur(10px);
}
.pay-bar-text{font-size:13px;color:#94a3b8;font-weight:500}
.btn-pay-top{
  padding:9px 22px;
  background:linear-gradient(135deg,#0ea5e9,#06b6d4);
  border:none;border-radius:100px;
  color:#fff;font-size:13px;font-weight:700;
  font-family:'Inter',sans-serif;cursor:pointer;
  box-shadow:0 4px 14px rgba(14,165,233,.35);
  transition:opacity .2s,transform .15s;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn-pay-top:hover{opacity:.9;transform:translateY(-1px)}

/* ── CONTENT PAGE ── */
.content-page{min-height:100vh;padding:28px 20px 70px}
.content-header{
  display:flex;align-items:center;gap:16px;
  max-width:1200px;margin:0 auto 28px;
  padding-bottom:20px;border-bottom:1px solid var(--border);
}
.content-header-info h2{font-size:20px;font-weight:800;color:var(--text)}
.content-header-info p{font-size:13px;color:var(--muted);margin-top:3px}
.content-header-back{
  margin-left:auto;padding:9px 18px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;color:var(--muted);font-size:13px;font-weight:600;
  cursor:pointer;text-decoration:none;transition:all .2s;white-space:nowrap;
}
.content-header-back:hover{color:var(--text);border-color:var(--primary)}

/* ── LESSONS GRID ── */
.lessons-grid{
  max-width:1200px;margin:0 auto;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
  gap:20px;
}

/* ── LESSON UNIT (one lesson = ppt + qmj + video) ── */
.lesson-unit{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  transition:border-color .2s,transform .2s,box-shadow .2s;
  display:flex;flex-direction:column;
}
.lesson-unit:hover{
  border-color:rgba(14,165,233,.4);
  transform:translateY(-3px);
  box-shadow:0 16px 40px rgba(0,0,0,.35);
}

/* ── PRESENTATION SECTION (top) ── */
.ppt-section{}

.ppt-preview{
  width:100%;height:160px;
  background:linear-gradient(135deg,#0f1e3e,#0d1b35);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.ppt-preview::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 40%,rgba(14,165,233,.18),transparent 60%),
             radial-gradient(ellipse at 70% 70%,rgba(139,92,246,.12),transparent 55%);
}
.ppt-slide-mock{
  position:relative;z-index:1;
  width:130px;height:82px;
  background:rgba(13,27,53,.8);
  border:1px solid rgba(14,165,233,.25);
  border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.ppt-slide-mock .slide-icon{font-size:26px;opacity:.85}
.ppt-slide-mock .slide-lines{display:flex;flex-direction:column;gap:4px;width:80px}
.slide-line{height:3px;border-radius:2px;background:rgba(14,165,233,.35)}
.slide-line.short{width:55%}
.slide-line.medium{width:80%}

.lesson-badge{
  position:absolute;top:10px;left:10px;
  background:rgba(14,165,233,.2);
  border:1px solid rgba(14,165,233,.35);
  border-radius:100px;
  padding:3px 10px;
  font-size:10px;font-weight:700;color:#38bdf8;letter-spacing:.5px;
  text-transform:uppercase;z-index:2;
}

.ppt-body{padding:12px 14px 10px}
.ppt-title{font-size:14px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:3px}
.ppt-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ppt-meta .badge-ppt{
  padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700;
  background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.25);
}

/* ── DIVIDER ── */
.unit-divider{
  height:1px;background:var(--border);margin:0;
}

/* ── SUB CARDS (ҚМЖ + Video — vertical stack) ── */
.sub-row{
  display:flex;flex-direction:column;
}

.sub-card{
  padding:14px 14px 16px;
  display:flex;flex-direction:column;gap:9px;
  border-top:1px solid var(--border);
}

.sub-preview{
  width:100%;height:150px;
  border-radius:10px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.sub-preview.qmj-preview{
  background:linear-gradient(135deg,#0d2c1a,#0d1b35);
  height:90px;
}
.sub-preview.video-preview{
  background:linear-gradient(135deg,#1a0d35,#0d1b35);
  cursor:pointer;
  height:180px;
}
.sub-preview-icon{font-size:28px;opacity:.7;position:relative;z-index:1}

/* Video inside preview */
.sub-preview video{
  width:100%;height:100%;object-fit:cover;
  border-radius:8px;
}
.play-overlay{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  z-index:2;
  background:rgba(0,0,0,.2);
  border-radius:8px;
  transition:background .2s;
}
.play-overlay .play-btn{
  width:32px;height:32px;
  background:rgba(255,255,255,.2);
  backdrop-filter:blur(6px);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.sub-preview:hover .play-overlay{background:rgba(0,0,0,.1)}

/* Pulsing ring for "video coming" */
.video-coming{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  position:relative;z-index:1;
}
.video-ring{
  width:36px;height:36px;border-radius:50%;
  border:2px solid rgba(139,92,246,.4);
  display:flex;align-items:center;justify-content:center;
  animation:ring-pulse 2s ease-in-out infinite;
}
@keyframes ring-pulse{
  0%,100%{border-color:rgba(139,92,246,.3);box-shadow:0 0 0 0 rgba(139,92,246,.2)}
  50%{border-color:rgba(139,92,246,.7);box-shadow:0 0 0 6px rgba(139,92,246,.0)}
}
.video-ring svg{opacity:.8}
.video-coming span{font-size:9px;color:rgba(196,181,253,.6);font-weight:600;letter-spacing:.3px}

/* ҚМЖ doc mock */
.qmj-doc{
  display:flex;flex-direction:column;gap:4px;padding:8px 10px;
  width:80px;
  background:rgba(16,185,129,.06);
  border:1px solid rgba(16,185,129,.15);
  border-radius:6px;
}
.qmj-doc-line{height:2.5px;border-radius:2px;background:rgba(16,185,129,.3)}
.qmj-doc-line.short{width:50%}
.qmj-doc-line.long{width:90%}

.sub-type-label{
  font-size:11px;font-weight:700;
  display:flex;align-items:center;gap:5px;
}
.sub-type-label.qmj-label{color:#6ee7b7}
.sub-type-label.vid-label{color:#c4b5fd}
.sub-meta{font-size:10px;color:var(--muted);flex:1}

/* ── DOWNLOAD BUTTONS ── */
.btn-download{
  padding:7px 10px;
  background:linear-gradient(135deg,var(--primary),var(--cyan));
  border:none;border-radius:8px;
  color:#fff;font-size:12px;font-weight:700;
  font-family:'Inter',sans-serif;
  cursor:pointer;width:100%;
  transition:opacity .2s;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.btn-download:hover{opacity:.85}
.btn-download.done{background:rgba(16,185,129,.12);color:#6ee7b7;cursor:default}
.btn-download.done:hover{opacity:1}


/* ── LESSON DOWNLOAD FOOTER ── */
.lesson-dl-footer{
  padding:12px 14px 16px;
  border-top:1px solid var(--border);
}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  .lessons-grid{grid-template-columns:1fr}
}
</style>

    ]},
    geometry: { lessons: [
      {title:'Шар және конус',        ppt:{meta:'22 слайд',src:null}, qmj:{meta:'Word · 6 бет',src:null}, video:{meta:'55 сек',src:null}},
      {title:'Цилиндр',               ppt:{meta:'20 слайд',src:null}, qmj:{meta:'Word · 5 бет',src:null}, video:{meta:'60 сек',src:null}},
      {title:'Беттер мен көлемдер',   ppt:{meta:'24 слайд',src:null}, qmj:{meta:'Word · 5 бет',src:null}, video:{meta:'65 сек',src:null}},
      {title:'ҰБТ дайындық',          ppt:{meta:'30 слайд',src:null}, qmj:{meta:'Word · 8 бет',src:null}, video:{meta:'70 сек',src:null}},
    ]},
  },
};

// ── Daily download tracking (per lesson) ──
const TODAY = new Date().toISOString().slice(0, 10);
function dlKey(idx) { return `gotab_dl_${grade}_${subject}_${idx}`; }
function wasDownloadedToday(idx) { return localStorage.getItem(dlKey(idx)) === TODAY; }
function markDone(idx) { localStorage.setItem(dlKey(idx), TODAY); }

// ── Render ──
function render() {
  const subjectData = (CONTENT[grade] || CONTENT[5])[subject]
    || Object.values(CONTENT[grade] || CONTENT[5])[0];
  const lessons = (subjectData && subjectData.lessons) || [];
  const grid = document.getElementById('lessonsGrid');

  if (!lessons.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:60px;font-size:15px">Материалдар жақын арада қосылады</div>`;
    return;
  }

  grid.innerHTML = lessons.map((lesson, i) => {
    const done = wasDownloadedToday(i);

    const videoPrev = lesson.video && lesson.video.src
      ? `<video src="${lesson.video.src}" autoplay muted loop playsinline></video>
         <div class="play-overlay">
           <div class="play-btn">
             <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
           </div>
         </div>`
      : `<div class="video-coming">
           <div class="video-ring">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c4b5fd" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
           </div>
           <span>ЖАҚЫНДА</span>
         </div>`;

    return `
    <div class="lesson-unit">

      <!-- PRESENTATION -->
      <div class="ppt-section">
        <div class="ppt-preview">
          <span class="lesson-badge">Сабақ ${i + 1}</span>
          <div class="ppt-slide-mock">
            <span class="slide-icon">📊</span>
            <div class="slide-lines">
              <div class="slide-line medium"></div>
              <div class="slide-line short"></div>
              <div class="slide-line medium"></div>
            </div>
          </div>
        </div>
        <div class="ppt-body">
          <div class="ppt-title">${lesson.title}</div>
          <div class="ppt-meta">
            <span class="badge-ppt">PPT</span>
            ${lesson.ppt ? lesson.ppt.meta : ''}
          </div>
        </div>
      </div>

      <div class="unit-divider"></div>

      <!-- ҚМЖ + VIDEO -->
      <div class="sub-row">

        <!-- ҚМЖ -->
        <div class="sub-card">
          <div class="sub-preview qmj-preview">
            <div class="qmj-doc">
              <div class="qmj-doc-line long"></div>
              <div class="qmj-doc-line short"></div>
              <div class="qmj-doc-line long"></div>
              <div class="qmj-doc-line short"></div>
              <div class="qmj-doc-line medium" style="width:70%"></div>
            </div>
          </div>
          <div class="sub-type-label qmj-label">
            <span>📄</span> ҚМЖ
          </div>
          <div class="sub-meta">${lesson.qmj ? lesson.qmj.meta : '—'}</div>
        </div>

        <!-- ANIMATION VIDEO -->
        <div class="sub-card">
          <div class="sub-preview video-preview">${videoPrev}</div>
          <div class="sub-type-label vid-label">
            <span>🎬</span> Анимация
          </div>
          <div class="sub-meta">${lesson.video ? lesson.video.meta : '—'}</div>
        </div>

      </div>

      <div class="lesson-dl-footer">
        <button class="btn-download ${done ? 'done' : ''}" data-idx="${i}">
          ${done ? '✓ Жүктелді' : '⬇ Барлығын жүктеу'}
        </button>
      </div>

    </div>`;
  }).join('');

  // Download click listeners
  grid.querySelectorAll('[data-idx]').forEach(btn => {
    btn.addEventListener('click', function() {
      if (this.classList.contains('done')) return;
      const idx = parseInt(this.dataset.idx);
      const lesson = lessons[idx];
      const hasSrc = lesson.ppt && lesson.ppt.src;

      if (hasSrc) {
        const a = document.createElement('a');
        a.href = lesson.ppt.src; a.download = ''; a.click();
        markDone(idx);
        this.textContent = '✓ Жүктелді';
        this.classList.add('done');
      } else {
        openModal();
      }
    });
  });
}

render();

// ── Payment modal ──
function openModal()  { document.getElementById('payModal').classList.add('open'); }
function closeModal() { document.getElementById('payModal').classList.remove('open'); }
document.getElementById('payModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

function sendReceipt() {
  const msg = encodeURIComponent('Сәлем! GoTAB платформасына жазылым үшін төлем жасадым. Чекті жіберемін.');
  window.open(`https://wa.me/77055894347?text=${msg}`, '_blank');
}
</script>
<script src="math-bg.js"></script>
</body>
</html>
