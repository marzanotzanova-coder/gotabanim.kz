<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoTAB — Материалдар</title>
<link rel="stylesheet" href="gotab.css">
<style>
/* ── TOP PAYMENT BAR ── */
.pay-bar{
  background:linear-gradient(135deg,rgba(14,165,233,.12),rgba(6,182,212,.08));
  border-bottom:1px solid rgba(14,165,233,.2);
  padding:12px 24px;
  display:flex;align-items:center;justify-content:center;gap:14px;
  flex-wrap:wrap;
  position:sticky;top:57px;z-index:90;
  backdrop-filter:blur(10px);
}
.pay-bar-text{font-size:13px;color:#94a3b8;font-weight:500}
.btn-pay-top{
  padding:9px 24px;
  background:linear-gradient(135deg,#0ea5e9,#06b6d4);
  border:none;border-radius:100px;
  color:#fff;font-size:13px;font-weight:700;
  font-family:'Inter',sans-serif;
  cursor:pointer;
  box-shadow:0 4px 16px rgba(14,165,233,.35);
  transition:opacity .2s,transform .15s;
  display:flex;align-items:center;gap:6px;
  white-space:nowrap;
}
.btn-pay-top:hover{opacity:.9;transform:translateY(-1px)}

/* ── CONTENT WRAPPER ── */
.content-page{min-height:100vh;padding:28px 20px 60px}

.content-header{
  display:flex;align-items:center;gap:16px;
  max-width:860px;margin:0 auto 32px;
  padding-bottom:20px;border-bottom:1px solid var(--border);
}
.content-header-info h2{font-size:20px;font-weight:800;color:var(--text)}
.content-header-info p{font-size:13px;color:var(--muted);margin-top:3px}
.content-header-back{
  margin-left:auto;padding:9px 18px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;color:var(--muted);font-size:13px;font-weight:600;
  cursor:pointer;text-decoration:none;transition:all .2s;white-space:nowrap;
}
.content-header-back:hover{color:var(--text);border-color:var(--primary)}

/* ── LESSONS LIST ── */
.lessons-list{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* ── LESSON CARD ── */
.lesson-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  transition:border-color .2s,transform .15s;
}
.lesson-card:hover{border-color:rgba(14,165,233,.35);transform:translateY(-1px)}

.lesson-header{
  padding:16px 20px 14px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.lesson-num{
  font-size:11px;font-weight:700;letter-spacing:.8px;
  color:#38bdf8;text-transform:uppercase;
  background:rgba(14,165,233,.1);
  padding:3px 10px;border-radius:100px;
  white-space:nowrap;
}
.lesson-title{font-size:16px;font-weight:700;color:var(--text)}

/* ── MATERIALS GRID ── */
.lesson-materials{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:0;
}
.material-item{
  padding:18px 20px 16px;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:6px;
}
.material-item:last-child{border-right:none}

.material-type-label{
  display:flex;align-items:center;gap:7px;
  font-size:12px;font-weight:700;letter-spacing:.4px;
}
.mat-icon{font-size:16px}

.type-ppt .material-type-label{color:#fca5a5}
.type-qmj .material-type-label{color:#6ee7b7}
.type-vid .material-type-label{color:#c4b5fd}

.material-meta-text{
  font-size:12px;color:var(--muted);
  flex:1;
  padding-bottom:2px;
}

.btn-dl{
  margin-top:4px;
  padding:8px 14px;
  border:1.5px solid rgba(14,165,233,.35);
  border-radius:8px;
  color:#38bdf8;
  background:transparent;
  font-size:12px;font-weight:700;
  font-family:'Inter',sans-serif;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  text-decoration:none;
  transition:all .2s;
  width:100%;
}
.btn-dl:hover{
  background:rgba(14,165,233,.1);
  border-color:#0ea5e9;
}
.btn-dl.locked{
  color:var(--muted);
  border-color:var(--border);
  cursor:default;
  opacity:.6;
}
.btn-dl.locked:hover{background:transparent;border-color:var(--border)}

/* ── EMPTY STATE ── */
.material-empty{
  padding:18px 20px 16px;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;color:var(--muted);font-size:12px;opacity:.5;
}
.material-empty:last-child{border-right:none}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .lesson-materials{grid-template-columns:1fr}
  .material-item{border-right:none;border-bottom:1px solid var(--border)}
  .material-item:last-child{border-bottom:none}
  .material-empty{border-right:none;border-bottom:1px solid var(--border)}
  .pay-bar{padding:10px 16px}
}
</style>
</head>

// ── Daily access tracking ──
const TODAY = new Date().toISOString().slice(0, 10);

function dlKey(lessonIdx, type) {
  return `gotab_dl_${grade}_${subject}_${lessonIdx}_${type}`;
}

function canDownloadToday(lessonIdx, type) {
  return localStorage.getItem(dlKey(lessonIdx, type)) !== TODAY;
}

function markDownloaded(lessonIdx, type) {
  localStorage.setItem(dlKey(lessonIdx, type), TODAY);
}

// ── Download handler ──
function handleDownload(btn, lessonIdx, type, src) {
  if (!canDownloadToday(lessonIdx, type)) return;

  if (src) {
    const a = document.createElement('a');
    a.href = src;
    a.download = '';
    a.click();
  } else {
    // File not uploaded yet — show payment modal
    openModal();
    return;
  }

  markDownloaded(lessonIdx, type);
  btn.textContent = '✓ Жүктелді';
  btn.classList.add('locked');
}

// ── Render lessons ──
function render() {
  const subjectData = (CONTENT[grade] || CONTENT[5])[subject]
    || Object.values(CONTENT[grade] || CONTENT[5])[0];
  const lessons = subjectData.lessons || [];

  const list = document.getElementById('lessonsList');

  if (!lessons.length) {
    list.innerHTML = `<div style="text-align:center;color:var(--muted);padding:60px 20px;font-size:15px">
      Материалдар жақын арада қосылады
    </div>`;
    return;
  }

  list.innerHTML = lessons.map((lesson, i) => {
    const pptBtn  = makeDownloadBtn(i, 'ppt',   lesson.ppt);
    const qmjBtn  = makeDownloadBtn(i, 'qmj',   lesson.qmj);
    const vidBtn  = makeDownloadBtn(i, 'video',  lesson.video);

    return `<div class="lesson-card">
      <div class="lesson-header">
        <span class="lesson-num">Сабақ ${i + 1}</span>
        <span class="lesson-title">${lesson.title}</span>
      </div>
      <div class="lesson-materials">

        <div class="material-item type-ppt">
          <div class="material-type-label">
            <span class="mat-icon">📊</span>
            Презентация
          </div>
          <div class="material-meta-text">${lesson.ppt ? lesson.ppt.meta : '—'}</div>
          ${pptBtn}
        </div>

        <div class="material-item type-qmj">
          <div class="material-type-label">
            <span class="mat-icon">📄</span>
            ҚМЖ
          </div>
          <div class="material-meta-text">${lesson.qmj ? lesson.qmj.meta : '—'}</div>
          ${qmjBtn}
        </div>

        <div class="material-item type-vid">
          <div class="material-type-label">
            <span class="mat-icon">🎬</span>
            Анимация
          </div>
          <div class="material-meta-text">${lesson.video ? lesson.video.meta : '—'}</div>
          ${vidBtn}
        </div>

      </div>
    </div>`;
  }).join('');

  // Attach click listeners to all download buttons
  list.querySelectorAll('[data-dl]').forEach(btn => {
    btn.addEventListener('click', function() {
      const idx  = parseInt(this.dataset.dl);
      const type = this.dataset.type;
      const src  = this.dataset.src || null;
      handleDownload(this, idx, type, src);
    });
  });
}

function makeDownloadBtn(idx, type, mat) {
  if (!mat) return '<div class="material-meta-text" style="opacity:.4">—</div>';

  const downloaded = !canDownloadToday(idx, type);
  const locked = downloaded ? ' locked' : '';
  const label  = downloaded ? '✓ Жүктелді' : '⬇ Жүктеу';
  const src    = mat.src ? `data-src="${mat.src}"` : '';

  return `<button class="btn-dl${locked}" data-dl="${idx}" data-type="${type}" ${src}>${label}</button>`;
}

render();

// ── Payment modal ──
function openModal() {
  document.getElementById('payModal').classList.add('open');
}
function closeModal() {
  document.getElementById('payModal').classList.remove('open');
}
document.getElementById('payModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

  const phone = '77055894347';
  const msg = encodeURIComponent('Сәлем! GoTAB платформасына жазылым үшін төлем жасадым. Чекті жіберемін.');
  window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
}
